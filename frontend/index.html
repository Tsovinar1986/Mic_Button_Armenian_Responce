<!doctype html>
<html lang="hy">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ձայնային Օգնական · Voice Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1>Ձայնային Օգնական</h1>
      </div>
      <div class="topbar-right">
        <div id="langSwitcher" class="lang-switcher" role="group" aria-label="Reply language">
          <button type="button" class="lang-btn active" data-lang="hy">ՀԱՅ</button>
          <button type="button" class="lang-btn" data-lang="ru">РУС</button>
          <button type="button" class="lang-btn" data-lang="en">ENG</button>
        </div>
        <span id="statusPill" class="status-pill status-unknown">connecting…</span>
      </div>
    </header>

    <main class="chat-shell">
      <div id="chat" class="chat"></div>

      <div id="listeningBanner" class="listening-banner hidden">
        <span class="live-dot"></span>
        <span id="interimText">Listening…</span>
      </div>

      <form id="composer" class="composer">
        <button type="button" id="micBtn" class="mic-btn" aria-label="Record voice message" title="Talk">
          <span class="mic-ring ring1"></span>
          <span class="mic-ring ring2"></span>
          <svg viewBox="0 0 24 24" class="mic-icon" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <input
          id="textInput"
          class="text-input"
          type="text"
          placeholder="Գրեք հայերեն, ռուսերեն կամ անգլերեն, կամ սեղմեք մայկը՝ խոսելու համար…"
          autocomplete="off"
        />

        <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <p id="supportNote" class="support-note"></p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
